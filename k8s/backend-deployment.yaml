apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: pravi-ai
data:
  OLLAMA_HOST: "http://ollama:11434"
  ENABLE_MULTI_GPU: "false"
  MULTI_GPU_CONFIG: "balanced"
  HOST: "0.0.0.0"
  PORT: "8000"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chroma-db
  namespace: pravi-ai
spec:
  accessModes:
    # ReadWriteMany needed for multiple backend replicas
    # If your storage class doesn't support RWX, use ReadWriteOnce and set replicas: 1
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: pravi-ai
  labels:
    app: backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: backend

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: pravi-ai
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
      - name: wait-for-ollama
        image: busybox:latest
        command: ['sh', '-c', 'until wget -q --spider http://ollama:11434/api/tags; do echo waiting for ollama; sleep 2; done;']
      containers:
      - name: backend
        image: pravi-ai-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: backend-config
        volumeMounts:
        - name: chroma-db
          mountPath: /app/chroma_db
        - name: logs
          mountPath: /app/logs
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: chroma-db
        persistentVolumeClaim:
          claimName: chroma-db
      - name: logs
        emptyDir: {}
